<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه اختصاصی نرگس و مهدی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark-glass: rgba(15, 15, 15, 0.4);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: radial-gradient(circle at top right, #2a2520, #0a0a0a);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
        }

        /* --- افکت شیشه‌ای پیشرفته --- */
        .glass-card {
            background: var(--dark-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- انیمیشن ورود سکانسی --- */
        .fade-in-up {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-in-up.active { opacity: 1; transform: translateY(0); }

        /* --- تایمر لوکس --- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }
        .timer-box {
            background: rgba(255,255,255,0.05);
            padding: 15px 5px;
            border-radius: 15px;
            border: 1px solid var(--gold);
        }
        .timer-num { font-family: 'Playfair Display'; font-size: 1.5rem; color: var(--gold); }
        .timer-label { font-size: 0.7rem; opacity: 0.7; }

        /* --- دکمه‌های درخشان --- */
        .btn-fancy {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, #b8860b, #daa520);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
            transition: 0.3s;
        }
        .btn-fancy:hover { transform: scale(1.02); filter: brightness(1.2); }

        h1 { font-family: 'Great Vibes'; font-size: 3.5rem; color: var(--gold); text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- هدر -->
    <div class="fade-in-up">
        <h1>نرگس و مهدی</h1>
        <p style="text-align: center; opacity: 0.8;">به جشن پیوند ما خوش آمدید</p>
    </div>

    <!-- تایمر -->
    <div class="glass-card fade-in-up" style="transition-delay: 0.2s;">
        <div class="timer-grid">
            <div class="timer-box"><div class="timer-num" id="d">00</div><div class="timer-label">روز</div></div>
            <div class="timer-box"><div class="timer-num" id="h">00</div><div class="timer-label">ساعت</div></div>
            <div class="timer-box"><div class="timer-num" id="m">00</div><div class="timer-label">دقیقه</div></div>
            <div class="timer-box"><div class="timer-num" id="s">00</div><div class="timer-label">ثانیه</div></div>
        </div>
    </div>

    <!-- کارت اطلاعات -->
    <div class="glass-card fade-in-up" style="transition-delay: 0.4s;">
        <h2 style="margin-bottom: 15px; font-family: 'Playfair Display';">زمان و مکان</h2>
        <p>پنج‌شنبه ۲۴ مهر ۱۴۰۵</p>
        <p style="color: var(--gold);">تهران، باغ تالار مجلل</p>
    </div>

    <button class="btn-fancy fade-in-up" style="transition-delay: 0.6s;">ثبت حضور در واتساپ</button>
</div>

<script>
    // منطق تایمر
    function update() {
        const target = new Date('2026-10-16T19:00:00').getTime();
        const now = new Date().getTime();
        const diff = target - now;
        document.getElementById('d').innerText = Math.floor(diff / (1000*60*60*24));
        document.getElementById('h').innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        document.getElementById('m').innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
        document.getElementById('s').innerText = Math.floor((diff % (1000*60)) / 1000);
    }
    setInterval(update, 1000);

    // اسکرول انیمیشن
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
    });
    document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
