<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دعوت‌نامه عروسی – Mahdi & Narges</title>

  <!-- Open Graph tags (برای پیش‌نمایش در پیام‌رسان‌ها) -->
  <meta property="og:title" content="دعوت‌نامه عروسی - Mahdi & Narges" />
  <meta property="og:description" content="دعوت به مراسم عقد و جشن عروسی" />
  <meta property="og:url" content="https://your-site.example/ invitation" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://your-site.example/og-image.jpg" />

  <style>
:root{
--bg: #f7f7fb;
--card: rgba(255,255,255,0.9);
--text: #1b1b1b;
--muted: #5a5a5a;
--primary: #4a6ea9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
margin:0;
font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Tahoma", "IranSans", Arial;
background: radial-gradient(circle at 20% -10%, #e9f0fb 0%, transparent 40%),
radial-gradient(circle at 100% 0%, #fff 0%, transparent 40%),
var(--bg);
color:var(--text);
direction: rtl;
}

.wrapper{
max-width: 720px;
margin: 0 auto;
padding: 16px;
}

header.hero{
text-align:center;
padding: 8px 0 16px;
}
.brand{
font-weight:700;
font-size:1.2rem;
color:#333;
}

/* تاریخ/تایمر */
.hero-date-row{
font-size: 1.15rem;
text-align:center;
margin: 6px 0 6px;
color:#444;
}

.countdown-grid-inline{
display:grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
justify-items: center;
align-items: center;
margin: 12px auto;
padding: 6px;
width: 100%;
max-width: 520px;
}

.cd-box{
width: 66px;
height: 66px;
background: rgba(255,255,255,0.95);
border: 1px solid rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
border-radius: 6px; /* مربعی با گوشه‌های کمی گرد */
box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.cd-num{
font-family: monospace;
font-size: 1.25rem;
font-weight: 700;
line-height: 1;
color:#222;
}
.cd-label{
font-size:.72rem;
color:#666;
margin-top:2px;
text-transform: capitalize;
}

/* تصویر/متن سکشن دو و نقشه */
section.section-two{
margin-top: 18px;
padding: 12px;
background: white;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}

/* نقشه / مینی‌مپ */
.map-frame{
width:100%;
height: 240px;
border:0;
border-radius: 12px;
overflow:hidden;
}

.map-footer-section{
width:100%;
text-align:center;
margin-top:14px;
}

.map-location-title{
font-weight:600;
font-size:.92rem;
color:#333;
margin-bottom:6px;
}

.map-divider{
width: 76%;
height:1px;
margin:6px auto 12px;
background: linear-gradient(to right, transparent, rgba(0,0,0,0.15), transparent);
}

.routing-logos-container{
display:flex;
justify-content:center;
gap:18px;
align-items:center;
flex-wrap:wrap;
}
.routing-logo-btn{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:inherit;
gap:6px;
}
.routing-logo-btn img{
width:38px;height:38px;object-fit:contain;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.routing-logo-btn span{
font-size:.72rem;
color:#555;
}

/* عمومی برای موبایل: متن ها راحت بخوانند */
@media (max-width: 640px){
.countdown-grid-inline{ grid-template-columns: repeat(4, 1fr); gap:8px; }
.cd-box{ width: 72px; height:72px; }
.map-frame{ height: 200px; }
}

  </style>
</head>
<body>

  <div class="wrapper">

<header class="hero" aria-label="دعوت‌نامه عروسی">
<div class="brand">دعوت‌نامه عروسی • Mahdi & Narges</div>
<!-- تاریخ نمایش در Hero، با تاریخ جدید 23 مهر 1405 -->
<div class="hero-date-row" id="heroDateRow">1405/07/23</div>
</header>

<!-- تایمر با ۴ جعبه مربع (Days, Hours, Minutes, Seconds) -->
<div class="countdown-grid-inline" id="countdown">
<div class="cd-box" aria-label="Days"><span class="cd-num" id="cdDays">00</span><span class="cd-label">Days</span></div>
<div class="cd-box" aria-label="Hours"><span class="cd-num" id="cdHours">00</span><span class="cd-label">Hours</span></div>
<div class="cd-box" aria-label="Minutes"><span class="cd-num" id="cdMinutes">00</span><span class="cd-label">Minutes</span></div>
<div class="cd-box" aria-label="Seconds"><span class="cd-num" id="cdSeconds">00</span><span class="cd-label">Seconds</span></div>
</div>

<!-- سکشن/بخش‌های دیگر (مثلاً توضیحات تاریخ، مکان و...) -->
<section class="section-two" aria-label="سِکشن دوم">
<p class="event-text" id="eventText" style="text-align:center;">
جمعه ۲۳ مهرماه ۱۴۰۵<br> از ساعت ۱۹:۰۰
</p>

<!-- نقشه مینی‌مپ در فریم اصلی -->
<div style="margin:0 auto; text-align:center;">
<iframe class="map-frame"
src="https://maps.google.com/maps?q=34.1173579,49.6697487&z=15&output=embed"
loading="lazy" title="نقشه موقعیت"></iframe>
</div>

<!-- بخش پایین مینی‌مپ: تیتر + خط + لوگوها (درخواست شما) -->
<div class="map-footer-section">
<div class="map-location-title">اراک، مرزجیران، باغ تالار ارم</div>
<div class="map-divider"></div>

<div class="routing-logos-container" aria-label="مسیرهای قابل استفاده">
<a class="routing-logo-btn" href="https://balad.ir/location/34.1173579,49.6697487" target="_blank" rel="noopener noreferrer" title="مسیر با بلد">
<img src="https://example.com/assets/logo-balad.png" alt="بلد">
<span>بلد</span>
</a>
<a class="routing-logo-btn" href="https://maps.google.com/maps?q=34.1173579,49.6697487" target="_blank" rel="noopener noreferrer" title="مسیر با گوگل مپ">
<img src="https://example.com/assets/logo-google.png" alt="گوگل مپ">
<span>Google Maps</span>
</a>
<a class="routing-logo-btn" href="https://maps.neshan.org/?lat=34.1173579&lng=49.6697487" target="_blank" rel="noopener noreferrer" title="نشان">
<img src="https://example.com/assets/logo-neshan.png" alt="نشان">
<span>نشان</span>
</a>
</div>
</div>

</section>

  </div>

  <script>
// تاریخ هدف جدید: 23 مهر 1405، 19:00 Iran Time
// ترجمه دقیق: 2026-10-15T19:00:00+03:30
const targetDate = new Date("2026-10-15T19:00:00+03:30").getTime();

// به‌روزرسانی نمایش تایمر هر 1 ثانیه
function updateCountdown(){
const now = Date.now();
let diff = Math.max(0, targetDate - now);

const seconds = Math.floor((diff / 1000) % 60);
const minutes = Math.floor((diff / (1000 * 60)) % 60);
const hours   = Math.floor((diff / (1000 * 60 * 60)) % 24);
const days    = Math.floor(diff / (1000 * 60 * 60 * 24));

document.getElementById('cdDays').textContent = String(days).padStart(2,'0');
document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
document.getElementById('cdMinutes').textContent = String(minutes).padStart(2,'0');
document.getElementById('cdSeconds').textContent = String(seconds).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

// متن تاریخ Hero هم باید به 23/07/1405 هماهنگ شود
document.getElementById('heroDateRow').textContent = "1405/07/23";
  </script>
</body>
</html>
