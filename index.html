<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوت‌نامه سینمایی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background-color: #0b0b0f; color: #fff; font-family: sans-serif; overflow: hidden; }

    /* صفحه اینترو */
    .intro-screen { position: fixed; inset: 0; z-index: 50; background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .intro-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .intro-hint { position: absolute; bottom: 40px; padding: 10px 22px; border-radius: 999px; background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18); pointer-events: none; }

    /* ترنزیشن */
    .white-overlay { position: fixed; inset: 0; background: #ffffff; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
    .white-overlay.active { opacity: 1; pointer-events: all; }

    /* سایت اصلی */
    .website-content { width: 100vw; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; opacity: 0; transition: opacity 0.4s; }
    .website-content.revealed { opacity: 1; }
    .scroll-section { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.5; }
    .section-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 2; }
    .section-card { position: relative; z-index: 3; max-width: 650px; padding: 32px; border-radius: 20px; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); transform: translateY(40px); opacity: 0; transition: transform 0.9s, opacity 0.9s; }
    .scroll-section.visible .section-card { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="white-overlay" id="whiteOverlay"></div>

  <div class="intro-screen" id="introScreen">
    <video class="intro-video" id="introVideo" autoplay muted playsinline src="intro-video.mp4"></video>
    <div class="intro-hint">برای ورود کلیک کنید</div>
  </div>

  <main class="website-content" id="websiteContent">
    
    <!-- سکشن ۱ -->
    <section class="scroll-section">
      <video class="bg-video" autoplay muted loop playsinline src="section1.mp4"></video>
      <div class="section-overlay"></div>
      <div class="section-card">
      </div>
    </section>

    <!-- سکشن ۲ -->
    <section class="scroll-section">
      <video class="bg-video" autoplay muted loop playsinline src="section2.mp4"></video>
      <div class="section-overlay"></div>
      <div class="section-card">
        <h2>بخش دوم</h2>
        <p>متن خود را اینجا وارد کنید.</p>
      </div>
    </section>

    <!-- سکشن ۳ -->
    <section class="scroll-section">
      <video class="bg-video" autoplay muted loop playsinline src="section3.mp4"></video>
      <div class="section-overlay"></div>
      <div class="section-card">
        <h2>بخش سوم</h2>
        <p>متن خود را اینجا وارد کنید.</p>
      </div>
    </section>

  </main>

  <script>
    const introScreen = document.getElementById('introScreen');
    const introVideo = document.getElementById('introVideo');
    const websiteContent = document.getElementById('websiteContent');
    const whiteOverlay = document.getElementById('whiteOverlay');

    function start() {
      whiteOverlay.classList.add('active');
      setTimeout(() => {
        introScreen.style.display = 'none';
        websiteContent.classList.add('revealed');
        whiteOverlay.classList.remove('active');
      }, 600);
    }

    introScreen.addEventListener('click', start);
    introVideo.addEventListener('ended', start);

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          const video = entry.target.querySelector('video');
          if (video) video.play().catch(() => {});
        }
      });
    }, { threshold: 0.45 });

    document.querySelectorAll('.scroll-section').forEach(section => observer.observe(section));
  </script>
</body>
</html>
