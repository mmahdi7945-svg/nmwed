<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه عروسی نرگس و مهدی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-dark: #0d0d0e;
            --glass-card: rgba(22, 22, 26, 0.65);
            --glass-border: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(212, 175, 55, 0.08) 0px, transparent 50%);
            color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* --- اسپلش اسکرین ویدیویی / کاور شروع --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        .splash-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        .btn-open {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* --- محفظه اصلی دعوت‌نامه --- */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 25px 18px 60px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .header-title {
            text-align: center;
            margin-top: 15px;
        }

        .header-title h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--gold-light);
            line-height: 1.2;
        }

        .header-title p {
            font-size: 0.95rem;
            color: #ccc;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* کارت‌های شیشه‌ای */
        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* تایمر معکوس */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 10px 4px;
        }

        .timer-num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .timer-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 2px;
        }

        /* دکمه اکشن واتساپ */
        .btn-whatsapp {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            padding: 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        /* دکمه شناور کنترل موزیک */
        #music-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            color: var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            z-index: 100;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- دکمه موزیک -->
    <div id="music-btn" onclick="toggleMusic()">🎵</div>

    <!-- موزیک پس‌زمینه (در صورت وجود music.mp3) -->
    <audio id="bg-audio" loop src="music.mp3"></audio>

    <!-- صفحه اول / اسپلش ویدیو -->
    <div id="splash-screen">
        <!-- اگر ویدیوت داخل روت هست intro.mp4 بذار، اگر توی پوشه هست مسیرش رو چک کن -->
        <video id="splash-video" playsinline loop muted autoplay src="intro.mp4"></video>
        <div class="splash-content">
            <h2 class="splash-title">Narges & Mahdi</h2>
            <button class="btn-open" onclick="openInvitation()">ورود به جشن 💍</button>
        </div>
    </div>

    <!-- بدنه اصلی کارت -->
    <div class="container">
        <div class="header-title">
            <h1>Narges & Mahdi</h1>
            <p>به جشن پیوند ما خوش آمدید</p>
        </div>

        <!-- بخش تایمر -->
        <div class="glass-card">
            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-bottom: 8px;">شمارش معکوس تا آغاز خاطره</h3>
            <div class="timer-grid">
                <div class="timer-box"><div class="timer-num" id="d">۰۰</div><div class="timer-label">روز</div></div>
                <div class="timer-box"><div class="timer-num" id="h">۰۰</div><div class="timer-label">ساعت</div></div>
                <div class="timer-box"><div class="timer-num" id="m">۰۰</div><div class="timer-label">دقیقه</div></div>
                <div class="timer-box"><div class="timer-num" id="s">۰۰</div><div class="timer-label">ثانیه</div></div>
            </div>
        </div>

        <!-- جزئیات مراسم -->
        <div class="glass-card">
            <h3 style="color: var(--gold); margin-bottom: 12px;">زمان و مکان دیدار</h3>
            <p style="margin-bottom: 8px; font-weight: 600;">پنج‌شنبه، ۲۴ مهر ۱۴۰۵</p>
            <p style="color: #bbb; font-size: 0.9rem; line-height: 1.6;">ساعت ۱۹:۰۰ الی ۲۳:۰۰</p>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
            <p style="color: var(--gold-light);">تهران، باغ تالار مجلل اختصاصی</p>
        </div>

        <!-- دکمه اعلام حضور -->
        <a href="https://wa.me/989120000000?text=سلام،+با+کمال+میل+در+جشن+شما+شرکت+می‌کنم." class="btn-whatsapp" target="_blank">
            اعلام حضور (RSVP) در واتساپ
        </a>
    </div>

    <script>
        // باز کردن کارت و اجرای موزیک
        function openInvitation() {
            const splash = document.getElementById('splash-screen');
            const audio = document.getElementById('bg-audio');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.visibility = 'hidden';
            }, 800);

            // تلاش برای پخش موزیک بعد از لمس کاربر
            audio.play().catch(err => console.log("Audio play blocked:", err));
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-audio');
            const btn = document.getElementById('music-btn');
            if (audio.paused) {
                audio.play();
                btn.innerText = '🎵';
            } else {
                audio.pause();
                btn.innerText = '🔇';
            }
        }

        // تایمر برای ۲۴ مهر ۱۴۰۵ (تقریباً 16 اکتبر 2026)
        function updateTimer() {
            const targetDate = new Date('2026-10-16T19:00:00').getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('d').innerText = days;
                document.getElementById('h').innerText = hours;
                document.getElementById('m').innerText = minutes;
                document.getElementById('s').innerText = seconds;
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
