<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوت‌نامه سینمایی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background-color: #0b0b0f; color: #fff; font-family: sans-serif; overflow: hidden; }

    /* صفحه اینترو */
    .intro-screen { position: fixed; inset: 0; z-index: 50; background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .intro-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .intro-hint { position: absolute; bottom: 40px; padding: 10px 22px; border-radius: 999px; background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18); pointer-events: none; }

    /* ترنزیشن */
    .white-overlay { position: fixed; inset: 0; background: #ffffff; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
    .white-overlay.active { opacity: 1; pointer-events: all; }

    /* سایت اصلی */
    .website-content { width: 100vw; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; opacity: 0; transition: opacity 0.4s; }
    .website-content.revealed { opacity: 1; }
    .scroll-section { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 1; }
    .section-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 2; }
    .section-card {
  position: relative;
  z-index: 3;
  width: 100%;
  padding: 20px;
  margin-bottom: 25px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);

  opacity: 0;
  transform: translateY(45px) scale(0.96);

  transition:
    opacity 0.75s ease,
    transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}
    /* استایل پاپ‌آپ شیشه‌ای موزیک */
    .music-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .music-modal-backdrop.show {
      opacity: 1;
      pointer-events: all;
    }
    .music-modal-box {
      background: rgba(120, 120, 128, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 24px 28px;
      max-width: 320px;
      width: 85%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .music-modal-backdrop.show .music-modal-box {
      transform: scale(1);
    }
    .music-modal-box p {
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: 500;
      line-height: 1.5;
    }
    .music-modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.2s, opacity 0.2s;
    }
    .modal-btn:active {
      transform: scale(0.95);
    }
    .btn-yes {
      background: rgba(34, 197, 94, 0.3);
      border: 1.5px solid #22c55e;
    }
    .btn-no {
      background: rgba(239, 68, 68, 0.3);
      border: 1.5px solid #ef4444;
    }

.scroll-section.visible .section-card {
  opacity: 1;
  transform: translateY(0) scale(1);
}
    
  </style>
</head>
<body>
  <!-- فایل صوتی -->
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <!-- پاپ‌آپ تایید پخش موزیک -->
  <div class="music-modal-backdrop" id="musicModal">
    <div class="music-modal-box">
      <p>آیا مایل هستید موزیک براتون پخش بشه؟</p>
      <div class="music-modal-actions">
        <button class="modal-btn btn-yes" id="musicYesBtn">بله</button>
        <button class="modal-btn btn-no" id="musicNoBtn">خیر</button>
      </div>
    </div>
  </div>

  <div class="white-overlay" id="whiteOverlay"></div>

  <div class="intro-screen" id="introScreen">
    <video class="intro-video" id="introVideo" autoplay muted playsinline src="intro-video.mp4"></video>
    <div class="intro-hint">برای ورود کلیک کنید</div>
  </div>

  <main class="website-content" id="websiteContent">
    
    <!-- سکشن ۱ -->
    <section class="scroll-section">
      <video autoplay muted loop playsinline src="section1.mp4"></video>
      </div>
    </section>

    <!-- سکشن ۲ -->
    <section class="scroll-section">
      <video class="bg-video" autoplay muted loop playsinline src="section2.mp4"></video>
      <div class="section-overlay"></div>
      <div class="section-card">
        <h2>بخش دوم</h2>
        <p>متن خود را اینجا وارد کنید.</p>
      </div>
    </section>

    <!-- سکشن ۳ -->
    <section class="scroll-section">
      <video class="bg-video" autoplay muted loop playsinline src="section3.mp4"></video>
      <div class="section-overlay"></div>
      <div class="section-card">
        <h2>بخش سوم</h2>
        <p>متن خود را اینجا وارد کنید.</p>
      </div>
    </section>

  </main>

  <script>
    const introScreen = document.getElementById('introScreen');
    const introVideo = document.getElementById('introVideo');
    const websiteContent = document.getElementById('websiteContent');
    const whiteOverlay = document.getElementById('whiteOverlay');
    const bgMusic = document.getElementById('bgMusic');
    const musicModal = document.getElementById('musicModal');
    const musicYesBtn = document.getElementById('musicYesBtn');
    const musicNoBtn = document.getElementById('musicNoBtn');

    function start() {
      whiteOverlay.classList.add('active');
      setTimeout(() => {
        introScreen.style.display = 'none';
        websiteContent.classList.add('revealed');
        whiteOverlay.classList.remove('active');
        musicModal.classList.add('show');
      }, 600);
    }

    introScreen.addEventListener('click', start);
    introVideo.addEventListener('ended', start);
    musicYesBtn.addEventListener('click', () => {
      bgMusic.play().catch(() => {});
      musicModal.classList.remove('show');
    });

    musicNoBtn.addEventListener('click', () => {
      musicModal.classList.remove('show');
    });

    const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const section = entry.target;
    const card = section.querySelector('.section-card');
    const video = section.querySelector('.bg-video');

    if (entry.isIntersecting) {
      // ورود به سکشن: انیمیشن اجرا می‌شود
      section.classList.add('visible');

      if (video) {
        video.play().catch(() => {});
      }
    } else {
      // خروج از سکشن: وضعیت به حالت اولیه برمی‌گردد
      section.classList.remove('visible');

      if (video) {
              }
    }
  });
}, {
  threshold: 0.55
});

document.querySelectorAll('.scroll-section').forEach(section => {
  observer.observe(section);
});
  </script>
</body>
</html>
