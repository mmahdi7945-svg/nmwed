<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوتنامه عروسی نرگس و محمد مهدی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ece9f5 50%, #fef8f9 100%);
            color: #2d2d2d;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== SPLASH VIDEO ========== */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #splash.hidden {
            display: none;
        }

        #splash video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #splash-skip {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        #splash-skip:hover {
            background: rgba(255,255,255,0.35);
            transform: translateX(-50%) scale(1.05);
        }

        /* ========== PARTICLES ========== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        /* ========== MAIN CONTAINER ========== */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px;
            position: relative;
            z-index: 2;
        }

        /* ========== HEADER ========== */
        .header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #4a3f5c;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .header .amp {
            font-size: 2rem;
            color: #c4a3d1;
            margin: 0 12px;
        }

        .header p {
            font-size: 1rem;
            color: #7a7a7a;
            margin-top: 16px;
        }

        /* ========== PHOTO SECTION ========== */
        .photo-section {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInUp 1.2s ease;
        }

        .photo-frame {
            display: inline-block;
            padding: 20px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(74, 63, 92, 0.08);
            border-radius: 8px;
            max-width: 100%;
        }

        .photo-frame img {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
            filter: grayscale(50%);
            border-radius: 4px;
        }

        /* ========== EVENT DETAILS ========== */
        .event-details {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            padding: 48px 32px;
            border-radius: 16px;
            margin-bottom: 60px;
            box-shadow: 0 4px 16px rgba(74, 63, 92, 0.06);
            animation: fadeInUp 1.4s ease;
        }

        .event-details h2 {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #4a3f5c;
            margin-bottom: 32px;
            text-align: center;
            position: relative;
        }

        .event-details h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c4a3d1, transparent);
            margin: 12px auto 0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            font-size: 1rem;
            color: #5a5a5a;
        }

        .detail-item svg {
            flex-shrink: 0;
            stroke: #c4a3d1;
            stroke-width: 1.5;
        }

        .detail-item strong {
            color: #4a3f5c;
        }

        /* ========== COUNTDOWN ========== */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 40px;
        }

        .countdown-item {
            background: #fff;
            padding: 20px 12px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(74, 63, 92, 0.06);
        }

        .countdown-item .number {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #4a3f5c;
        }

        .countdown-item .label {
            font-size: 0.85rem;
            color: #9a9a9a;
            margin-top: 4px;
        }

        /* ========== MAP LINKS ========== */
        .map-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: #fff;
            color: #4a3f5c;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 2px 12px rgba(74, 63, 92, 0.08);
            transition: all 0.3s ease;
        }

        .map-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(74, 63, 92, 0.12);
            background: #f9f7ff;
        }

        .map-btn svg {
            width: 18px;
            height: 18px;
            stroke: #c4a3d1;
        }

        /* ========== RSVP ========== */
        .rsvp-section {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 1.6s ease;
        }

        .rsvp-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #c4a3d1 0%, #a48bb8 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(196, 163, 209, 0.3);
            transition: all 0.3s ease;
        }

        .rsvp-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(196, 163, 209, 0.4);
        }

        .rsvp-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ========== MUSIC CONTROL ========== */
        .music-control {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(74, 63, 92, 0.15);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(74, 63, 92, 0.2);
        }

        .music-control svg {
            width: 24px;
            height: 24px;
            stroke: #c4a3d1;
            fill: none;
            stroke-width: 2;
        }

        .music-control.playing svg.pause-icon {
            display: block;
        }

        .music-control.playing svg.play-icon {
            display: none;
        }

        .music-control:not(.playing) svg.pause-icon {
            display: none;
        }

        .music-control:not(.playing) svg.play-icon {
            display: block;
        }

        /* ========== FOOTER ========== */
        footer {
            text-align: center;
            padding: 40px 24px;
            color: #9a9a9a;
            font-size: 0.9rem;
        }

        footer svg {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin: 0 4px;
            fill: #c4a3d1;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.2rem;
            }
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .countdown-item .number {
                font-size: 1.6rem;
            }
            .music-control {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== SPLASH VIDEO ========== -->
    <div id="splash">
        <video id="splash-video" autoplay muted playsinline>
            <source src="./intro.mp4" type="video/mp4">
        </video>
        <button id="splash-skip">رد شدن</button>
    </div>

    <!-- ========== PARTICLES ========== -->
    <canvas id="particles"></canvas>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <h1>
                نرگس
                <span class="amp">&</span>
                محمد مهدی
            </h1>
            <p>با کمال افتخار شما را به جشن عروسی خود دعوت می‌کنیم</p>
        </header>

        <!-- PHOTO -->
        <section class="photo-section">
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?w=800&q=80" alt="نرگس و محمد مهدی">
            </div>
        </section>

        <!-- EVENT DETAILS -->
        <section class="event-details">
            <h2>جزئیات مراسم</h2>

            <div class="detail-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="6" width="18" height="15" rx="2" />
                    <path d="M3 10h18M8 3v6M16 3v6" />
                </svg>
                <div>
                    <strong>تاریخ:</strong> پنج‌شنبه ۲۴ مهر ۱۴۰۵
                </div>
            </div>

            <div class="detail-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 6v6l4 2" />
                </svg>
                <div>
                    <strong>ساعت:</strong> ۱۹:۰۰
                </div>
            </div>

            <div class="detail-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <div>
                    <strong>مکان:</strong> باغ تالار مجلل ارم
                </div>
            </div>

            <!-- COUNTDOWN -->
            <div class="countdown">
                <div class="countdown-item">
                    <div class="number" id="days">00</div>
                    <div class="label">روز</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="hours">00</div>
                    <div class="label">ساعت</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="minutes">00</div>
                    <div class="label">دقیقه</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="seconds">00</div>
                    <div class="label">ثانیه</div>
                </div>
            </div>

            <!-- MAP LINKS -->
            <div class="map-links">
                <a href="https://neshan.org/maps/places/5b60e8b52ab9457d1e47b1861b7104e4#c34.117-49.675-15z-0p" target="_blank" class="map-btn">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    نشان
                </a>
                <a href="https://balad.ir/p/%D8%A8%D8%A7%D8%BA-%D8%AA%D8%A7%D9%84%D8%A7%D8%B1-%D9%85%D8%AC%D9%84%D9%84-%D8%A7%D8%B1%D9%85_ceremonial-services-PBoqVO7dYACB1Y#15/34.11821/49.67404" target="_blank" class="map-btn">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    بلد
                </a>
                <a href="https://www.google.com/maps/place/%D8%A8%D8%A7%D8%BA+%D8%AA%D8%A7%D9%84%D8%A7%D8%B1+%D8%A7%D8%B1%D9%85%E2%80%AD/@34.117336,49.6704753,17.76z/data=!4m6!3m5!1s0x3feceaecc369aa87:0x3ed0ec51a1b5825c!8m2!3d34.1173579!4d49.6697487!16s%2Fg%2F11f35b0scr?entry=ttu&g_ep=EgoyMDI2MDgyNi4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="map-btn">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    گوگل مپ
                </a>
            </div>
        </section>

        <!-- RSVP -->
        <section class="rsvp-section">
            <a href="#" class="rsvp-btn" id="rsvp-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 11l3 3L22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
                تایید حضور
            </a>
        </section>

    </div>

    <!-- FOOTER -->
    <footer>
        ساخته شده با
        <svg viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
        برای نرگس و محمد مهدی
    </footer>

    <!-- MUSIC CONTROL -->
    <div class="music-control" id="music-control">
        <svg class="play-icon" viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none" />
        </svg>
        <svg class="pause-icon" viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
        </svg>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" loop>
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        // ========== SPLASH VIDEO ==========
        const splash = document.getElementById('splash');
        const splashVideo = document.getElementById('splash-video');
        const splashSkip = document.getElementById('splash-skip');
        const bgMusic = document.getElementById('bg-music');

        function hideSplash() {
            splash.classList.add('hidden');
            bgMusic.play().catch(e => console.log('Autoplay prevented'));
        }

        splashVideo.addEventListener('ended', hideSplash);
        splashSkip.addEventListener('click', hideSplash);
        splash.addEventListener('click', (e) => {
            if (e.target === splash || e.target === splashVideo) {
                hideSplash();
            }
        });

        // ========== MUSIC CONTROL ==========
        const musicControl = document.getElementById('music-control');

        musicControl.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicControl.classList.add('playing');
            } else {
                bgMusic.pause();
                musicControl.classList.remove('playing');
            }
        });

        bgMusic.addEventListener('play', () => {
            musicControl.classList.add('playing');
        });

        bgMusic.addEventListener('pause', () => {
            musicControl.classList.remove('playing');
        });

        // ========== COUNTDOWN ==========
        const weddingDate = new Date('2026-10-16T19:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ========== RSVP ==========
        document.getElementById('rsvp-btn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('لطفاً برای تایید حضور با ما تماس بگیرید.');
        });

        // ========== PARTICLES ==========
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(196, 163, 209, ${p.opacity})`;
                ctx.fill();

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            });

            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>

</body>
</html>
