<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Video Experience</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* فعال‌سازی اسکرول نرم و چفت شدن به هر بخش */
        .video-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        /* هر اسلاید یا صفحه ویدیویی */
        .section {
            position: relative;
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* تنظیم ویدیو پس‌زمینه */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        /* لایه تاریک یا شیشه‌ای روی ویدیو برای خوانایی بهتر */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        /* محتوای متنی و انیمیشن روی ویدیو */
        .content {
            position: relative;
            z-index: 3;
            color: #fff;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* کلاسی که هنگام دیده شدن فعال می‌شود */
        .section.visible .content {
            opacity: 1;
            transform: translateY(0);
        }

        .content h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .content p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="video-container">
        
        <!-- سکشن اول -->
        <section class="section">
            <video class="bg-video" autoplay muted loop playsinline preload="auto">
                <source src="video1.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <h1>عنوان بخش اول</h1>
                <p>توضیح کوتاه با انیمیشن ورود نرم</p>
            </div>
        </section>

        <!-- سکشن دوم -->
        <section class="section">
            <video class="bg-video" autoplay muted loop playsinline preload="auto">
                <source src="video2.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <h1>عنوان بخش دوم</h1>
                <p>ویدیوی بعدی با تکرار مداوم و بدون وقفه</p>
            </div>
        </section>

        <!-- سکشن سوم -->
        <section class="section">
            <video class="bg-video" autoplay muted loop playsinline preload="auto">
                <source src="video3.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <h1>عنوان بخش سوم</h1>
                <p>طراحی مدرن، روان و مبتنی بر موشن</p>
            </div>
        </section>

    </div>

    <script>
        // اضافه کردن کلاس visible هنگام قرار گرفتن بخش در دید کاربر
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    // اطمینان از پخش ویدیو
                    const video = entry.target.querySelector('video');
                    if (video && video.paused) {
                        video.play();
                    }
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.section').forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
