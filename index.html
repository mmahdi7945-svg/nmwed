    <title>دعوت‌نامه سینمایی نرگس و مهدی</title>
    <style>
        /* General Styles & Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #0b0b0f; color: #f1f1f1; font-family: sans-serif; overflow: hidden; }
        .website-content { width: 100vw; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; opacity: 0; transition: opacity 0.4s; }
        .website-content.revealed { opacity: 1; }
        .scroll-section { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; text-align: center; background-color: transparent; overflow: hidden; }
        .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 1; }
        .section-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 2; }
        .section-card {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(45px) scale(0.96);
            transition: opacity 0.75s ease, transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-section.visible .section-card { opacity: 1; transform: translateY(0) scale(1); }

        /* Fonts */
        @font-face { font-family: 'BellMTCustom'; src: url('./BellMT.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'EdwardianScript'; src: url('./EdwardianScriptITC.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Yekan'; src: url('./Yekan.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        .font-yekan { font-family: 'Yekan', Tahoma, sans-serif !important; }

        /* Hero Section Styles */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
        }
        .hero-front.hero-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            direction: ltr;
            text-align: left;
            user-select: none;
            color: #000000;
        }
        .hero-swirl-divider {
            position: absolute;
            top: 74px; left: 50%;
            width: 280px; height: auto;
            margin-left: -140px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .hero-names-block {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }
        .hero-name-row {
            font-family: 'BellMTCustom', serif;
            font-size: 105.33px;
            font-weight: normal; font-style: normal;
            color: #000000;
            letter-spacing: 0;
            line-height: 0.82;
            white-space: nowrap;
        }
        .hero-name-narges {
            position: absolute;
            top: 116px; left: 0;
            width: 100%;
            text-align: left;
        }
        .hero-and-narges-row {
            position: absolute;
            top: 207px; left: 0;
            width: 100%; height: 100px;
            direction: ltr;
            display: block;
        }
        .hero-name-mahdi {
            position: absolute;
            top: 0; left: 56px;
            font-family: 'BellMTCustom', serif;
            font-size: 105.33px;
            font-weight: normal; font-style: normal;
            color: #000000;
            letter-spacing: 0;
            line-height: 0.82;
            white-space: nowrap;
        }
        .hero-and-script {
            position: absolute;
            left: -10px; top: 18.5px;
            display: block;
            font-family: 'EdwardianScript', cursive;
            font-size: 42.67px;
            font-weight: normal; font-style: normal;
            line-height: 1;
            letter-spacing: 0;
            color: #000000;
            white-space: nowrap;
        }
        .hero-date-row {
            position: absolute;
            top: 303px; left: -10;
            width: 100%;
            font-family: 'EdwardianScript', cursive;
            font-size: 31.37px;
            font-weight: normal; font-style: normal;
            line-height: 1;
            color: #000000;
            letter-spacing: 0.64em;
            text-indent: 0.64em;
            text-align: center;
            white-space: nowrap;
            direction: ltr;
        }
        .hero-text-group {
            transform: translateX(20px) translateY(-10px) scale(0.75);
            transform-origin: center center;
        }

        /* Flip Card Styles */
        .hero-flip-card {
            position: relative;
            width: min(82vw, 330px);
            height: min(66vh, 455px);
            max-height: 455px;
            perspective: 1300px;
            -webkit-perspective: 1300px;
            z-index: 3;
            overflow: hidden;
        }
        .hero-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        .hero-flip-card.flipped .hero-flip-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .hero-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }
        .hero-front {
            display: flex;
            width: 100%;
            height: 100%;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .hero-front:focus-visible {
            outline: 2px solid rgba(65, 65, 65, 0.6);
            outline-offset: 8px;
        }
        .hero-back {
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            padding: 15px 10px;
            box-sizing: border-box;
            flex-direction: column; /* For header title */
        }
        .hero-flip-card.flipped .hero-front { pointer-events: none; }
        .hero-flip-card.flipped .hero-back { pointer-events: auto; }
        .hero-front:active { opacity: 0.94; }

        /* Scratch Card Styles */
        .scratch-photo-frame {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: #d8d8d8;
            border: 8px solid rgba(255, 255, 255, 0.94);
            border-bottom-width: 24px;
            box-shadow: 0 22px 46px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.12);
        }
        .scratch-photo {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
            filter: brightness(0.96) saturate(0.9);
        }
        .scratch-canvas {
            position: absolute;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        .scratch-canvas:active { cursor: grabbing; }
        .scratch-photo-frame.revealed .scratch-canvas { opacity: 0; visibility: hidden; pointer-events: none; }
        .scratch-reveal-flash {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: rgba(255, 255, 255, 0.95);
            mix-blend-mode: screen;
        }
        .scratch-photo-frame.revealed .scratch-reveal-flash { animation: scratchFlash 1.15s ease-out forwards; }
        .scratch-photo-frame.revealed .scratch-photo { animation: revealedPhoto 1.25s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes scratchFlash { 0% { opacity: 0; } 18% { opacity: 0.95; } 38% { opacity: 0.2; } 55% { opacity: 0.72; } 100% { opacity: 0; } }
        @keyframes revealedPhoto { 0% { filter: brightness(0.96) saturate(0.9); transform: scale(1); } 30% { filter: brightness(1.4) saturate(1.05); transform: scale(1.035); } 100% { filter: brightness(1) saturate(1); transform: scale(1); } }

        /* Glass Layer & NOONMEEM Overlay Styles */
        .photo-glass-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.08) 42%, rgba(255, 255, 255, 0.24));
            backdrop-filter: blur(7px) saturate(125%);
            -webkit-backdrop-filter: blur(7px) saturate(125%);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .scratch-photo-frame.glass-active .photo-glass-layer { opacity: 1; visibility: visible; pointer-events: auto; }
        .photo-glass-layer::before {
            content: "";
            position: absolute;
            top: -20%; left: -55%;
            width: 42%; height: 150%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
            transform: rotate(18deg);
            opacity: 0;
            pointer-events: none;
        }
        .scratch-photo-frame.glass-active .photo-glass-layer::before { animation: glassShine 1.4s ease-out 0.15s forwards; }
        @keyframes glassShine { 0% { left: -55%; opacity: 0; } 18% { opacity: 1; } 100% { left: 130%; opacity: 0; } }

        .noonmeem-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transform: scale(0.92) rotate(-2deg);
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.3)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.55));
            transition: opacity 0.75s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scratch-photo-frame.glass-active .noonmeem-overlay { opacity: 1; transform: scale(1) rotate(0deg); animation: noonmeemFloat 3.2s ease-in-out 1s infinite; }
        @keyframes noonmeemFloat { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.025) translateY(-4px); } }

        /* Header title above scratch photo */
        .scratch-header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
            gap: 10px;
            margin-bottom: 12px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(-8px);
            animation: romanticFadeIn 0.8s ease forwards;
            animation-delay: 0.3s;
        }
        @keyframes romanticFadeIn { to { opacity: 1; transform: translateY(0); } }
        .scratch-name {
            font-family: 'EdwardianScript', cursive, serif;
            font-size: 38pt;
            color: #000000;
            line-height: 1;
            user-select: none;
        }
        .scratch-heart-icon {
            width: 30px; height: auto;
            display: inline-block;
            animation: heartSoftPulse 2s ease-in-out infinite;
        }
        @keyframes heartSoftPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @media (max-width: 420px) {
            .scratch-name { font-size: 28pt; }
            .scratch-heart-icon { width: 24px; }
        }

        /* Media Queries & Reduced Motion */
        @media (max-height: 650px) { .hero-flip-card { height: min(70vh, 390px); width: min(76vw, 290px); } }
        @media (max-height: 560px) { .hero-flip-card { height: min(74vh, 340px); width: min(72vw, 260px); } }
        @media (max-width: 360px) { .hero-flip-card { width: min(84vw, 295px); height: min(62vh, 410px); } }
        @media (max-width: 380px) { .noonmeem-overlay { width: 100%; height: 100%; object-fit: cover; } }
        @media (prefers-reduced-motion: reduce) {
            .photo-glass-layer::before, .noonmeem-overlay { animation: none !important; }
            .noonmeem-overlay { transition-duration: 0.01ms; }
        }
        .scratch-photo-frame:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.85); outline-offset: 5px; }

        /* Entrance Animations for Hero Section */
        .hero-section .hero-swirl-divider,
        .hero-section .hero-name-narges,
        .hero-section .hero-and-narges-row,
        .hero-section .hero-date-row {
            opacity: 0;
            transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .hero-section .hero-swirl-divider { transform: translateY(25px); }
        .hero-section .hero-name-narges { transform: translateY(25px); }
        .hero-section .hero-and-narges-row { transform: translateY(25px); }
        .hero-section .hero-date-row { transform: translateY(25px); }

        .hero-section.visible .hero-swirl-divider { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
        .hero-section.visible .hero-name-narges { opacity: 1; transform: translateY(0); transition-delay: 0.25s; }
        .hero-section.visible .hero-and-narges-row { opacity: 1; transform: translateY(0); transition-delay: 0.45s; }
        .hero-section.visible .hero-date-row { opacity: 1; transform: translateY(0); transition-delay: 0.65s; }

    </style>
</head>
<body>

    <main class="website-content" id="websiteContent">
        <!-- سکشن ۱ -->
        <section class="scroll-section hero-section" id="heroSection">
            <div class="hero-flip-card" id="heroFlipCard">
                <div class="hero-flip-inner">
                    <!-- وجه جلو کارت (Text Side) -->
                    <div class="hero-face hero-front hero-content" id="heroFront" role="button" tabindex="0" aria-label="نمایش عکس">
                        <div class="hero-text-group">
                            <img src="NM (1).png" alt="خط تزئینی" class="hero-swirl-divider">
                            <div class="hero-names-block">
                                <div class="hero-name-row hero-name-narges">Narges</div>
                                <div class="hero-and-narges-row">
                                    <span class="hero-and-script">And</span>
                                    <span class="hero-name-row hero-name-mahdi">Mahdi</span>
                                </div>
                            </div>
                            <div class="hero-date-row">1405.07.23</div>
                        </div>
                    </div>

                    <!-- وجه پشت کارت (Photo Side) -->
                    <div class="hero-face hero-back">
                        <!-- ۱. عنوان بالای عکس: Narges ♡ Mahdi -->
                        <div class="scratch-header-title">
                            <span class="scratch-name">Narges</span>
                            <img src="Heartse1.png" alt="Love" class="scratch-heart-icon" />
                            <span class="scratch-name">Mahdi</span>
                        </div>

                        <!-- ۲. قاب عکس خراشیدنی -->
                        <div class="scratch-photo-frame" id="scratchArea" role="button" tabindex="0" aria-label="برای نمایش نشان، روی عکس کلیک کنید">
                            <img src="hero-photo.jpg" class="scratch-photo" id="scratchPhoto" alt="Our Moment" draggable="false" />

                            <!-- لایه فلش اولیه پس از پاک‌شدن پوشش -->
                            <div class="scratch-reveal-flash" aria-hidden="true"></div>

                            <!-- لایه شیشه‌ای که با کلیک روی عکس فعال می‌شود -->
                            <div class="photo-glass-layer" id="photoGlassLayer">
                                <img src="NOONMEEM.png" alt="نشان دعوت‌نامه" class="noonmeem-overlay">
                            </div>

                            <canvas class="scratch-canvas" id="scratchCanvas" aria-label="پوشش عکس را با حرکت انگشت پاک کنید"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- انتهای سکشن ۱ -->
    </main>

    <script>
        // JavaScript for Hero Section Interactions
        const heroFlipCard = document.getElementById('heroFlipCard');
        const heroFront = document.getElementById('heroFront');
        const scratchArea = document.getElementById('scratchArea');
        const scratchCanvas = document.getElementById('scratchCanvas');

        const scratchContext = scratchCanvas ? scratchCanvas.getContext('2d', { willReadFrequently: false }) : null;

        let scratchInitialized = false;
        let scratchCompleted = false;
        let isScratching = false;
        let previousPoint = null;

        // Constants for scratch grid and radius
        const scratchGridColumns = 18;
        const scratchGridRows = 24;
        const scratchedCells = new Set();

        function initializeScratchCanvas() {
            if (scratchInitialized || scratchCompleted) {
                return;
            }

            const rect = scratchCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) {
                return;
            }

            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            scratchCanvas.width = Math.round(rect.width * pixelRatio);
            scratchCanvas.height = Math.round(rect.height * pixelRatio);

            scratchContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            // Silver coating
            const coating = scratchContext.createLinearGradient(0, 0, rect.width, rect.height);
            coating.addColorStop(0, '#d8d8d8');
            coating.addColorStop(0.28, '#a8aaad');
            coating.addColorStop(0.52, '#eeeeee');
            coating.addColorStop(0.76, '#999ca0');
            coating.addColorStop(1, '#d4d4d4');
            scratchContext.globalCompositeOperation = 'source-over';
            scratchContext.fillStyle = coating;
            scratchContext.fillRect(0, 0, rect.width, rect.height);

            // Fine texture on coating
            for (let i = 0; i < 900; i += 1) {
                const x = Math.random() * rect.width;
                const y = Math.random() * rect.height;
                const opacity = 0.025 + Math.random() * 0.07;
                scratchContext.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                scratchContext.fillRect(x, y, 1.2, 1.2);
            }

            // Central marker on coating
            scratchContext.fillStyle = 'rgba(55, 55, 55, 0.72)';
            scratchContext.textAlign = 'center';
            scratchContext.textBaseline = 'middle';
            scratchContext.font = 'bold 15px BYekan, Tahoma, sans-serif';
            scratchContext.fillText('با انگشت روی تصویر بکشید', rect.width / 2, rect.height / 2);
            scratchContext.strokeStyle = 'rgba(55, 55, 55, 0.42)';
            scratchContext.lineWidth = 2;
            scratchContext.beginPath();
            scratchContext.moveTo(rect.width / 2 - 45, rect.height / 2 + 28);
            scratchContext.quadraticCurveTo(rect.width / 2, rect.height / 2 + 42, rect.width / 2 + 45, rect.height / 2 + 28);
            scratchContext.stroke();

            scratchInitialized = true;
        }

        function flipHeroCard() {
            if (heroFlipCard.classList.contains('flipped')) {
                return;
            }
            heroFlipCard.classList.add('flipped');
            heroFront.setAttribute('aria-hidden', 'true');
            heroFront.setAttribute('tabindex', '-1');
            window.setTimeout(initializeScratchCanvas, 350); // Delay canvas init until flip starts
        }

        if (heroFront && heroFlipCard) heroFront.addEventListener('click', flipHeroCard);
        heroFront.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                flipHeroCard();
            }
        });

        function getScratchPoint(event) {
            const rect = scratchCanvas.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        function registerScratchedCells(point, brushRadius) {
            const rect = scratchCanvas.getBoundingClientRect();
            const cellWidth = rect.width / scratchGridColumns;
            const cellHeight = rect.height / scratchGridRows;

            const centerColumn = Math.floor(point.x / cellWidth);
            const centerRow = Math.floor(point.y / cellHeight);
            const columnRadius = Math.ceil(brushRadius / cellWidth);
            const rowRadius = Math.ceil(brushRadius / cellHeight);

            for (let row = centerRow - rowRadius; row <= centerRow + rowRadius; row += 1) {
                for (let column = centerColumn - columnRadius; column <= centerColumn + columnRadius; column += 1) {
                    if (row < 0 || row >= scratchGridRows || column < 0 || column >= scratchGridColumns) continue;

                    const cellCenterX = (column + 0.5) * cellWidth;
                    const cellCenterY = (row + 0.5) * cellHeight;
                    const distance = Math.hypot(point.x - cellCenterX, point.y - cellCenterY);

                    if (distance <= brushRadius + Math.max(cellWidth, cellHeight)) {
                        scratchedCells.add(`${column}:${row}`);
                    }
                }
            }
        }

        function eraseScratchLine(from, to) {
            if (scratchCompleted) return;

            const rect = scratchCanvas.getBoundingClientRect();
            const brushRadius = Math.max(24, Math.min(38, rect.width * 0.1));

            scratchContext.save();
            scratchContext.globalCompositeOperation = 'destination-out';
            scratchContext.lineCap = 'round';
            scratchContext.lineJoin = 'round';
            scratchContext.lineWidth = brushRadius * 2;

            scratchContext.beginPath();
            scratchContext.moveTo(from.x, from.y);
            scratchContext.lineTo(to.x, to.y);
            scratchContext.stroke();
            scratchContext.restore();

            const distance = Math.hypot(to.x - from.x, to.y - from.y);
            const stepSize = Math.max(8, brushRadius * 0.35);
            const steps = Math.max(1, Math.ceil(distance / stepSize));

            for (let index = 0; index <= steps; index += 1) {
                const progress = index / steps;
                registerScratchedCells({
                    x: from.x + (to.x - from.x) * progress,
                    y: from.y + (to.y - from.y) * progress
                }, brushRadius);
            }

            const totalCells = scratchGridColumns * scratchGridRows;
            const revealedRatio = scratchedCells.size / totalCells;

            if (revealedRatio >= 0.55) {
                completeScratchReveal();
            }
        }

        function completeScratchReveal() {
            if (scratchCompleted) return;
            scratchCompleted = true;
            isScratching = false;
            previousPoint = null;
            scratchArea.classList.add('revealed');
            scratchCanvas.style.pointerEvents = 'none';
            scratchCanvas.setAttribute('aria-hidden', 'true');
